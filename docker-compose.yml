version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: facecontrol-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      POSTGRES_DB: primeapp
      POSTGRES_USER: postgres
    ports:
      - "1001:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d primeapp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  deepface-worker-rs:
    build:
      context: ./deepface-worker-rs
    container_name: facecontrol-deepface-worker-rs
    environment:
      CUDA_VISIBLE_DEVICES: "-1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8054/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 20
      start_period: 240s
    tmpfs:
      - /tmp:rw,size=512m,mode=1777

  face-auth-bridge:
    build:
      context: ./face-auth-bridge
    container_name: facecontrol-face-auth-bridge
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/primeapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      PRIME_FACE_WORKER_URL: http://deepface-worker-rs:8054
      PRIME_FACE_BRIDGE_SECRET: ${PRIME_FACE_BRIDGE_SECRET:-dev-face-secret}
    depends_on:
      postgres:
        condition: service_healthy
      deepface-worker-rs:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,size=256m,mode=1777

  keycloak:
    image: facecontrol-keycloak:23-deepface
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    container_name: facecontrol-keycloak
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      face-auth-bridge:
        condition: service_started
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/primeapp
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_URL: http://localhost:8080/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_DB_POOL_INITIAL_SIZE: 1
      KC_DB_POOL_MIN_SIZE: 1
      KC_DB_POOL_MAX_SIZE: 10
      QUARKUS_DATASOURCE_JDBC_ENABLE_XA: "false"
      PRIME_FACE_BRIDGE_URL: http://face-auth-bridge:8071
      PRIME_FACE_BRIDGE_SECRET: ${PRIME_FACE_BRIDGE_SECRET:-dev-face-secret}
      PRIME_FACE_SELF_ENROLL_ON_FIRST_LOGIN: "true"
      QUARKUS_HTTP_LIMITS_MAX_BODY_SIZE: 64M
      JAVA_OPTS_APPEND: "-Dquarkus.http.limits.max-body-size=64M"
    volumes:
      - ./keycloak/prime-realm.json:/opt/keycloak/data/import/prime-realm.json
      - ./keycloak/docker-entrypoint.sh:/opt/keycloak/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/opt/keycloak/docker-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /auth/realms/prime/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -qE \"HTTP/1\\.[01] 200\"'",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 180s
    restart: unless-stopped

volumes:
  postgres-data:
