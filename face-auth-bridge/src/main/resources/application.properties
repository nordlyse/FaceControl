server.port=8071
server.tomcat.max-http-form-post-size=32MB
server.tomcat.max-swallow-size=32MB

spring.application.name=face-auth-bridge

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your-super-secret-password}
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=600000

face.worker-base-url=${FACE_WORKER_URL:http://deepface-worker-rs:8054}
face.internal-secret=${FACE_BRIDGE_SECRET:dev-face-secret}
face.require-enrollment=${FACE_REQUIRE_ENROLLMENT:true}

management.endpoints.web.exposure.include=health,info
management.health.diskspace.enabled=false
