server.port=8071
# Keycloak sends ~few×JPEG bytes as JSON base64; default Tomcat post limits (~2MB) can abort parsing → opaque 500s.
server.tomcat.max-http-form-post-size=32MB
server.tomcat.max-swallow-size=32MB

spring.application.name=face-auth-bridge

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/primeapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your-super-secret-password}
# Recover cleanly when Postgres briefly restarts (WAL recovery / broken client).
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=600000

prime.face.worker-base-url=${PRIME_FACE_WORKER_URL:http://deepface-worker-rs:8054}
prime.face.internal-secret=${PRIME_FACE_BRIDGE_SECRET:dev-face-secret}
prime.face.require-enrollment=${PRIME_FACE_REQUIRE_ENROLLMENT:true}

management.endpoints.web.exposure.include=health,info
# Slim Docker layers often report 0 bytes free under /app → noisy WARNs and health DOWN; bridge is stateless.
management.health.diskspace.enabled=false
